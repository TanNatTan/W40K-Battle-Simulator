<svg viewBox="0 0 680 460" xmlns="http://www.w3.org/2000/svg" style="--primary:#e8a33d;--primary-dark:#b9791f"><style>
@media (prefers-reduced-motion: no-preference){
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes pulseScale{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.18);opacity:.7}}
  @keyframes glowPulse{0%,100%{opacity:.85}50%{opacity:.35}}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
  #radar-hq{transform-box:view-box;transform-origin:85px 110px;animation:spin 4s linear infinite}
  #drill-teeth{transform-box:view-box;transform-origin:425px 110px;animation:spin 6s linear infinite}
  #reactor-core{transform-box:fill-box;transform-origin:center;animation:pulseScale 2s ease-in-out infinite}
  #farm-hub{animation:glowPulse 2.6s ease-in-out infinite}
  #vent1{animation:blink 1.6s ease-in-out infinite}
  #vent2{animation:blink 1.6s ease-in-out infinite .3s}
  #vent3{animation:blink 1.6s ease-in-out infinite .6s}
  #stack1{animation:blink 2s ease-in-out infinite}
  #stack2{animation:blink 2s ease-in-out infinite .5s}
  #hazard1,#hazard2,#hazard3,#hazard4{animation:blink 1.4s ease-in-out infinite}
  #crate1{animation:blink 1.8s ease-in-out infinite}
  #crate2{animation:blink 1.8s ease-in-out infinite .3s}
  #crate3{animation:blink 1.8s ease-in-out infinite .6s}
}
</style>

